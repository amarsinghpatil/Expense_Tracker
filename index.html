<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Expense Calculator</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v4 Browser CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen py-8 px-4 flex justify-center">
    <main class="w-full max-w-5xl flex flex-col gap-6">

        <!-- 1. Compact Brand Header -->
        <header class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-lg shadow-sm">
                💳
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 leading-tight">Expense Tracker</h1>
                <p class="text-xs text-slate-500">Track your cashflow and maintain your budget</p>
            </div>
        </header>

        <!-- 2. Summary Balance Cards (Top Banner) -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <!-- Card 1: Net Balance -->
            <div class="bg-blue-50/70 border border-blue-200/80 rounded-2xl p-4 text-center shadow-xs transition hover:shadow-md">
                <h3 class="text-xs font-bold uppercase tracking-wider text-blue-600 mb-1">Net Balance</h3>
                <p id="net-balance" class="text-2xl font-bold text-blue-700">$0.00</p>
            </div>

            <!-- Card 2: Total Income -->
            <div class="bg-emerald-50/70 border border-emerald-200/80 rounded-2xl p-4 text-center shadow-xs transition hover:shadow-md">
                <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-600 mb-1">Total Income</h3>
                <p id="total-income" class="text-2xl font-bold text-emerald-700">$0.00</p>
            </div>

            <!-- Card 3: Total Expenses -->
            <div class="bg-rose-50/70 border border-rose-200/80 rounded-2xl p-4 text-center shadow-xs transition hover:shadow-md">
                <h3 class="text-xs font-bold uppercase tracking-wider text-rose-600 mb-1">Total Expenses</h3>
                <p id="total-expense" class="text-2xl font-bold text-rose-700">$0.00</p>
            </div>
        </section>

        <!-- 3. Two-Column Dashboard Workspace -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

            <!-- LEFT COLUMN: Transaction Form (5 cols) -->
            <section class="lg:col-span-5 bg-white border border-slate-200 rounded-2xl p-6 shadow-xs">
                <h2 class="text-base font-bold text-slate-800 mb-4">Add Transaction</h2>

                <form id="entry-form" class="flex flex-col gap-4">
                    <!-- Description Field -->
                    <div class="flex flex-col gap-1.5">
                        <label for="description" class="text-xs font-semibold uppercase tracking-wider text-slate-600">Description</label>
                        <input 
                            type="text" 
                            id="description" 
                            placeholder="e.g. Salary, Groceries, Rent" 
                            required
                            class="px-3.5 py-2.5 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition bg-white text-slate-900"
                        >
                    </div>

                    <!-- Amount Field -->
                    <div class="flex flex-col gap-1.5">
                        <label for="amount" class="text-xs font-semibold uppercase tracking-wider text-slate-600">Amount ($)</label>
                        <input 
                            type="number" 
                            id="amount" 
                            placeholder="0.00" 
                            required 
                            min="0.01" 
                            step="0.01"
                            class="px-3.5 py-2.5 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition bg-white text-slate-900"
                        >
                    </div>

                    <!-- Type Selection Dropdown -->
                    <div class="flex flex-col gap-1.5">
                        <label for="type" class="text-xs font-semibold uppercase tracking-wider text-slate-600">Type</label>
                        <select 
                            id="type" 
                            required
                            class="px-3.5 py-2.5 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition bg-white text-slate-900 cursor-pointer"
                        >
                            <option value="">Select Type</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-3 pt-2">
                        <button 
                            type="submit" 
                            id="submit-btn"
                            class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-xs hover:shadow-sm transition cursor-pointer"
                        >
                            Add Entry
                        </button>
                        <button 
                            type="reset" 
                            id="cancel-btn"
                            class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-lg border border-slate-200 transition cursor-pointer"
                        >
                            Reset
                        </button>
                    </div>
                </form>
            </section>

            <!-- RIGHT COLUMN: Filters + Transaction History (7 cols) -->
            <section class="lg:col-span-7 bg-white border border-slate-200 rounded-2xl p-6 shadow-xs flex flex-col gap-4">
                
                <!-- History Header + Filter Tabs Inline -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                    <h2 class="text-base font-bold text-slate-800">History</h2>

                    <!-- Filter Radio Buttons -->
                    <div class="flex gap-1 bg-slate-100 p-1 rounded-lg self-start sm:self-auto">
                        <label class="cursor-pointer">
                            <input type="radio" id="all-filter" name="filter" value="all" checked class="peer sr-only">
                            <span class="block px-3 py-1 text-xs font-semibold rounded-md text-slate-600 transition peer-checked:bg-white peer-checked:text-indigo-600 peer-checked:shadow-xs">All</span>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" id="income-filter" name="filter" value="income" class="peer sr-only">
                            <span class="block px-3 py-1 text-xs font-semibold rounded-md text-slate-600 transition peer-checked:bg-white peer-checked:text-emerald-600 peer-checked:shadow-xs">Income</span>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" id="expense-filter" name="filter" value="expense" class="peer sr-only">
                            <span class="block px-3 py-1 text-xs font-semibold rounded-md text-slate-600 transition peer-checked:bg-white peer-checked:text-rose-600 peer-checked:shadow-xs">Expense</span>
                        </label>
                    </div>
                </div>

                <!-- Empty State Message -->
                <p id="no-entries" class="text-center py-10 px-4 text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-xl">
                    No transactions yet. Add your first entry on the left!
                </p>

                <!-- Dynamic List Populated by JavaScript with Smooth Scroll -->
                <ul id="entries-list" class="flex flex-col gap-3 max-h-[420px] overflow-y-auto pr-1">
                   
                </ul>
            </section>

        </div>

    </main>

    <script src="app.js"></script>
</body>

</html>
